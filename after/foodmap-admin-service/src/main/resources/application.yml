server:
  port: ${SERVER_PORT:8088}

logging:
  pattern:
    dateformat: "yyyy-MM-dd HH:mm:ss:SSS"

spring:
  application:
    name: foodmap-admin-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${FOODMAP_PROFILE:local}}
  config:
    import:
      - optional:nacos:foodmap-logging-${SPRING_PROFILES_ACTIVE:${FOODMAP_PROFILE:local}}.yml?refreshEnabled=true
      - optional:nacos:${spring.application.name}-${SPRING_PROFILES_ACTIVE:${FOODMAP_PROFILE:local}}.yml?refreshEnabled=true
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${NACOS_CONFIG_GROUP:FOODMAP}
        file-extension: yml
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

foodmap:
  env:
    profile: ${SPRING_PROFILES_ACTIVE:${FOODMAP_PROFILE:local}}
  admin:
    log-service:
      base-url: ${ADMIN_LOG_SERVICE_BASE_URL:http://127.0.0.1:8089}
      request-timeout: ${ADMIN_LOG_SERVICE_REQUEST_TIMEOUT:5s}
    login-rate-limit:
      max-failures: ${ADMIN_LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      window: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW:5m}
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      entries:
        - username: ${ADMIN_BOOTSTRAP_USERNAME:}
          display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
          password: ${ADMIN_BOOTSTRAP_PASSWORD:}
          role-codes: ${ADMIN_BOOTSTRAP_ROLE_CODES:OPS_VIEWER}
        - username: ${ADMIN_BOOTSTRAP_USERNAME_2:}
          display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME_2:}
          password: ${ADMIN_BOOTSTRAP_PASSWORD_2:${ADMIN_BOOTSTRAP_PASSWORD:}}
          role-codes: ${ADMIN_BOOTSTRAP_ROLE_CODES_2:}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

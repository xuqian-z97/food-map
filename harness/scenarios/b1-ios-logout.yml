name: B1 iOS 登录后登出链路
description: "模拟器启动 Debug 构建，用探针完成登录→登出→检查探针日志与数据库 token 状态；Release 包不含探针"
config:
  platform: ios
  udid: A77A2428-9576-4533-8B62-0C267A395B29
  baseUrl: http://127.0.0.1:8080
vars:
  bundleId: com.foodmap.FoodMapApp
  password: ${env:FM_TEST_PW}
  dbContainer: foodmap-postgres
setup:
  - http: GET ${baseUrl}/internal/auth/health
    retry: { max: 30, intervalMs: 1000 }
    expect: { status: 200 }
  - command: "printf 'zxq_ios_%s' $(date +%H%M%S)"
    capture: { account: stdout }
  - http: POST ${baseUrl}/api/auth/register
    json:
      accountName: ${account}
      password: ${password}
      nickname: ios-probe
      registeredChannel: IOS
    expect: { status: 200 }
    capture: { userId: data.userId }
  - command: "wc -l < /tmp/verify-auth.log"
    capture: { logStart: value }

steps:
  - app: terminate ${udid} ${bundleId}

  - app: launch ${udid} ${bundleId}
    env:
      FOODMAP_AUTOMATION: login-then-logout
      FOODMAP_ACCOUNT: ${account}
      FOODMAP_PASSWORD: ${password}
      FOODMAP_BASE_URL: ${baseUrl}

  - sleep: 12000

  - app: readlog ${udid} ${bundleId} Documents/foodmap-automation.log
    expect:
      contains:
        - "login.ok"
        - "logout.begin hasSession=true"
        - "logout.end sessionNil=true"

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select count(*) from refresh_tokens rt join auth_accounts a on a.account_id = rt.account_id where a.account_name = '${account}' and rt.token_status = 'REVOKED'\""
    capture:
      revoked: value
    expect:
      exitCode: 0

  - command: "[ ${revoked} -ge 1 ]"
    expect:
      exitCode: 0
teardown:
  - command: "docker exec ${dbContainer} sh -c 'uid=$(psql -U foodmap -d foodmap_auth_db -tAc \"select user_id from auth_accounts where account_name='\''${account}'\''\"); if [ -n \"$uid\" ]; then for t in user_settings user_profiles users; do psql -U foodmap -d foodmap_user_db -c \"delete from $t where user_id=$uid\" >/dev/null; done; fi'"
    expect: { exitCode: 0 }
  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_sessions where user_id in (select user_id from auth_accounts where account_name = '${account}')\""
    expect: { exitCode: 0 }
  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_identity_bindings where user_id in (select user_id from auth_accounts where account_name = '${account}')\""
    expect: { exitCode: 0 }
  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from login_logs where account_id in (select account_id from auth_accounts where account_name = '${account}')\""
    expect: { exitCode: 0 }
  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from refresh_tokens where account_id in (select account_id from auth_accounts where account_name = '${account}')\""
    expect: { exitCode: 0 }
  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_credentials where account_id in (select account_id from auth_accounts where account_name = '${account}')\""
    expect: { exitCode: 0 }
  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_accounts where account_name = '${account}'\""
    expect: { exitCode: 0 }
  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select count(*) from auth_accounts where account_name = '${account}'\""
    expect: { equals: "0" }

name: B1 退出登录链路（接口级）
requires: [network, sql, redis, test-password]
description: "真实网关复跑 B1 登出链路：注册→登录→当前用户→登出→旧 Token 失效；Redis 与 PostgreSQL 走 docker exec，不落 Token；teardown 只清理本轮账号并断言清零"
config:
  baseUrl: http://127.0.0.1:8080
vars:
  redisContainer: foodmap-redis
  dbContainer: foodmap-postgres
  userDbName: foodmap_user_db
setup:
  - command: "date +%s"
    capture:
      stamp: value
    expect:
      exitCode: 0

  - http: POST /api/auth/register
    json:
      accountName: zxq_vk_${stamp}
      phone: null
      email: null
      password: ${env:FM_TEST_PW}
      nickname: verify-kit
      registeredChannel: IOS
    expect:
      status: 200
      json: { code: OK }
    capture:
      userId: data.userId

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select account_id from auth_accounts where account_name='zxq_vk_${stamp}'\""
    capture:
      accountId: value
    expect:
      exitCode: 0

steps:
  - http: POST /api/auth/login
    json:
      loginIdentifier: zxq_vk_${stamp}
      password: ${env:FM_TEST_PW}
    expect:
      status: 200
      json: { code: OK }
    capture:
      access: data.accessToken
      refresh: data.refreshToken

  - http: GET /api/users/me
    headers:
      Authorization: Bearer ${access}
    expect:
      status: 200
      json: { code: OK }

  # Token 分段绕过：签名只覆盖前两段，追加完整第 4 段后签名仍有效，
  # 但 Access Token 必须因段数不等于 3 直接 401，不能进入网关后续处理。
  - http: GET /api/users/me
    headers:
      Authorization: Bearer ${access}.appended
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  # 已提供但格式无效的 Authorization 不能降级成无头兼容分支。
  - http: POST /api/auth/logout
    headers:
      Authorization: Basic invalid
    json:
      refreshToken: ${refresh}
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  - http: POST /api/auth/logout
    headers:
      Authorization: "Bearer "
    json:
      refreshToken: ${refresh}
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  - http: POST /api/auth/logout
    headers:
      Authorization: Bearer not-a-valid-token
    json:
      refreshToken: ${refresh}
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select count(*) from refresh_tokens where account_id=${accountId} and token_status='ACTIVE'\""
    expect:
      equals: "1"

  - command: "docker exec ${redisContainer} redis-cli --scan --pattern 'foodmap:auth:access-token-denylist:v1:*' | wc -l"
    capture:
      before: value
    expect:
      exitCode: 0

  - http: POST /api/auth/logout
    headers:
      Authorization: Bearer ${access}
    json:
      refreshToken: ${refresh}
    expect:
      status: 200

  - command: "docker exec ${redisContainer} redis-cli --scan --pattern 'foodmap:auth:access-token-denylist:v1:*' | wc -l"
    capture:
      after: value
    expect:
      exitCode: 0

  - command: "[ ${after} -eq $(( ${before} + 1 )) ]"
    expect:
      exitCode: 0

  - http: GET /api/users/me
    headers:
      Authorization: Bearer ${access}
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  # 原 Token 已在拒绝名单；追加空段不能改变哈希后重新进入业务链路。
  - http: GET /api/users/me
    headers:
      Authorization: Bearer ${access}.
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  - http: GET /api/users/me
    headers:
      Authorization: Bearer ${access}..
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  - http: POST /api/auth/refresh
    json:
      refreshToken: ${refresh}
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select count(*) from refresh_tokens where account_id=${accountId} and token_status='REVOKED'\""
    capture:
      revoked: value
    expect:
      exitCode: 0

  - command: "[ ${revoked} -eq 1 ]"
    expect:
      exitCode: 0

  # 边界：不带 Authorization 登出只撤销 Refresh Token，旧 Access Token 不会进入拒绝名单，
  # 在自然过期前仍可用。该行为用于兼容旧调用方，客户端登出应始终携带 Access Token。
  - http: POST /api/auth/login
    json:
      loginIdentifier: zxq_vk_${stamp}
      password: ${env:FM_TEST_PW}
    expect:
      status: 200
      json: { code: OK }
    capture:
      boundaryAccess: data.accessToken
      boundaryRefresh: data.refreshToken

  - http: POST /api/auth/logout
    json:
      refreshToken: ${boundaryRefresh}
    expect:
      status: 200

  - http: GET /api/users/me
    headers:
      Authorization: Bearer ${boundaryAccess}
    expect:
      status: 200
      json: { code: OK }

  - command: "docker exec ${redisContainer} redis-cli --scan --pattern 'foodmap:auth:access-token-denylist:v1:*' | wc -l"
    capture:
      afterNoAuth: value
    expect:
      exitCode: 0

  - command: "[ ${afterNoAuth} -eq ${after} ]"
    expect:
      exitCode: 0

  - http: POST /api/auth/refresh
    json:
      refreshToken: ${boundaryRefresh}
    expect:
      status: 401
      json: { code: UNAUTHORIZED }

# 只清理本轮生成的账号（按 account_id / user_id），不按前缀删库，也不触碰历史数据。
teardown:
  - command: "docker exec ${dbContainer} sh -c 'for t in user_settings user_profiles users; do psql -U foodmap -d ${userDbName} -c \"delete from $t where user_id=${userId}\" >/dev/null; done'"
    expect:
      exitCode: 0

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_sessions where user_id=${userId}\""
    expect:
      exitCode: 0

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_identity_bindings where user_id=${userId}\""
    expect:
      exitCode: 0

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from login_logs where account_id=${accountId}\""
    expect:
      exitCode: 0

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from refresh_tokens where account_id=${accountId}\""
    expect:
      exitCode: 0

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_credentials where account_id=${accountId}\""
    expect:
      exitCode: 0

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -c \"delete from auth_accounts where account_id=${accountId}\""
    expect:
      exitCode: 0

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select count(*) from auth_accounts where account_id=${accountId}\""
    expect:
      equals: "0"

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select (select count(*) from auth_identity_bindings where user_id=${userId}) + (select count(*) from auth_sessions where user_id=${userId})\""
    expect:
      equals: "0"

  - command: "docker exec ${dbContainer} psql -U foodmap -d foodmap_auth_db -tAc \"select (select count(*) from refresh_tokens where account_id=${accountId}) + (select count(*) from login_logs where account_id=${accountId}) + (select count(*) from auth_credentials where account_id=${accountId})\""
    expect:
      equals: "0"

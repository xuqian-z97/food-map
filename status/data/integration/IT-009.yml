schemaVersion: 1
id: IT-009
title: 退出登录后双 Token 失效
features:
  - F-003
services:
  - gateway
  - auth
  - redis
needChain: "true"
review: pending
reviewNote: "BUG-011 待模拟器复测，需要先通过评审再执行"
scenarios:
  - id: S1
    name: 携带双 Token 退出
    method: POST
    path: "/api/auth/logout"
    auth: accessToken
    expectStatus: "200"
    expectCode: OK
  - id: S2
    name: 旧 Access Token 再访问受保护接口
    method: GET
    path: "/api/users/me"
    auth: denylistedAccessToken
    expectStatus: "401"
    expectCode: UNAUTHORIZED
  - id: S3
    name: 旧 Refresh Token 再刷新
    method: POST
    path: "/api/auth/refresh"
    auth: refreshToken
    expectStatus: "401"
    expectCode: UNAUTHORIZED

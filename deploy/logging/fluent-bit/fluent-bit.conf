[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    storage.path  /fluent-bit/state

[INPUT]
    Name              tail
    Tag               foodmap.raw
    Path              /foodmap/logs/*.log
    Read_from_Head    true
    Refresh_Interval  5
    Rotate_Wait       30
    DB                /fluent-bit/state/foodmap-tail.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 应用日志由 logback 输出为单行 JSON，这里把 log 字段解析成顶层字段；
# Reserve_Data/Preserve_Key 保证原始行和其他字段不丢失，解析失败时记录仍留在 foodmap.raw。
[FILTER]
    Name          parser
    Match         foodmap.raw
    Key_Name      log
    Parser        foodmap_json
    Reserve_Data  On
    Preserve_Key  On

# 只按 JSON 字段 logType 路由，禁止再用 message 文本正则匹配事件名前缀。
# 事件名调整、国际化或字段顺序变化都不会影响路由；logType 的取值由 foodmap-common 的 LogMdcKeys 固定。
[FILTER]
    Name         rewrite_tag
    Match        foodmap.raw
    Rule         $logType ^application$ foodmap.application false
    Rule         $logType ^api-access$  foodmap.api-access  false
    Rule         $logType ^sql$         foodmap.sql         false
    Rule         $logType ^audit$       foodmap.audit       false
    Rule         $logType ^security$    foodmap.security    false
    Emitter_Name foodmap_log_router

# application 日志和无法解析成 JSON 的兜底行都进入 application topic。
# rewrite_tag 的 false 表示命中后从 foodmap.raw 移除，因此同一行不会重复投递。
[OUTPUT]
    Name        kafka
    Match       foodmap.application
    Brokers     ${KAFKA_BROKERS}
    Topics      foodmap.logs.application
    Format      json
    Retry_Limit False
    rdkafka.client.id foodmap-fluent-bit-application

[OUTPUT]
    Name        kafka
    Match       foodmap.raw
    Brokers     ${KAFKA_BROKERS}
    Topics      foodmap.logs.application
    Format      json
    Retry_Limit False
    rdkafka.client.id foodmap-fluent-bit-application-fallback

[OUTPUT]
    Name        kafka
    Match       foodmap.api-access
    Brokers     ${KAFKA_BROKERS}
    Topics      foodmap.logs.api-access
    Format      json
    Retry_Limit False
    rdkafka.client.id foodmap-fluent-bit-api-access

[OUTPUT]
    Name        kafka
    Match       foodmap.sql
    Brokers     ${KAFKA_BROKERS}
    Topics      foodmap.logs.sql
    Format      json
    Retry_Limit False
    rdkafka.client.id foodmap-fluent-bit-sql

[OUTPUT]
    Name        kafka
    Match       foodmap.audit
    Brokers     ${KAFKA_BROKERS}
    Topics      foodmap.logs.audit
    Format      json
    Retry_Limit False
    rdkafka.client.id foodmap-fluent-bit-audit

[OUTPUT]
    Name        kafka
    Match       foodmap.security
    Brokers     ${KAFKA_BROKERS}
    Topics      foodmap.logs.security
    Format      json
    Retry_Limit False
    rdkafka.client.id foodmap-fluent-bit-security

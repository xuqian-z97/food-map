# FoodMap 应用日志 JSON parser。
#
# 输入：logback-common.xml 中 LoggingEventCompositeJsonEncoder 输出的单行 JSON，顶层字段为
# timestamp / level / logType / logger / thread / requestId / traceId / spanId / serviceName /
# accountId / userId / message（异常时还有 stackTrace）。
#
# 时间处理与 logback 输出对齐（2026-11 起）：
# - logstash-logback-encoder 8.0 默认使用 DateTimeFormatter.ISO_OFFSET_DATE_TIME，
#   timestamp 实际形如 2026-11-09T16:20:31.482+08:00，UTC 容器下形如 2026-11-09T08:20:31.482Z；
# - Fluent Bit 的 strptime %z 只接受 +0800 这类不带冒号的偏移，无法匹配 +08:00，
#   强行配置 Time_Format 会产生 parse error 或错误的事件时间。
# 因此这里不设置 Time_Key/Time_Format，timestamp 保持为普通 JSON 字段透传；
# 事件时间由 Logstash 的 date/ISO8601 过滤器从 timestamp 还原到 @timestamp，
# Fluent Bit 记录时间退化为采集时间。禁止把时间格式改回 %z，也禁止按 message 文本路由日志类型。
[PARSER]
    Name        foodmap_json
    Format      json
